<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno – DSM</title>
</head>
<body>

    <h1>Cadastro de Aluno – DSM</h1>

    <p>Preencha os dados abaixo para realizar o cadastro do novo aluno:</p>

    <form action="#" method="POST">

        <fieldset>
            <legend>Dados Pessoais</legend>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            <p>
                <label for="data-nascimento">Data de nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento">
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <p>
                <label for="curso">Curso:</label>
                <select id="curso" name="curso">
                    <option value="dsm">DSM</option>
                    <option value="ads">ADS</option>
                    <option value="outro">Outro</option>
                </select>
            </p>
            <p>Período:</p>
            <p>
                <input type="radio" id="manha" name="periodo" value="manha">
                <label for="manha">Manhã</label>
            </p>
            <p>
                <input type="radio" id="noite" name="periodo" value="noite">
                <label for="noite">Noite</label>
            </p>
            <p>
                <label for="observacoes">Observações:</label><br>
                <textarea id="observacoes" name="observacoes" rows="3" cols="30"></textarea>
            </p>
        </fieldset>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
